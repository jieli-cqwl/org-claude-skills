# Co-creation ledger contract for long product baseline collaboration.
#
# These ledgers are recovery/support artifacts. They preserve user-confirmed
# checkpoints and drift decisions, but they do not replace canonical JSON
# artifacts as downstream control inputs.
co_creation_ledgers:
  version: 1
  control_input: false
  required_fields:
    - artifact_type
    - schema_version
    - producer
    - scope_ref
    - current_state
    - latest_checkpoint_id
    - confirmations
    - open_questions
    - supersedes
    - handoff_refs
    - finalization_basis
  confirmation_fields:
    - checkpoint_id
    - step
    - subject_ref
    - confirmed_at
    - decision_summary
    - source_refs
    - output_refs
  ledgers:
    product-director:
      artifact_type: co-creation-ledger
      producer: product-director
      path: docs/{feature}/product-director-ledger.json
      scope: feature
      purpose: pre_finalization_recovery_and_confirmation
      downstream_canonical_source: false
      allowed_content:
        - checkpoint
        - subject_ref
        - user_confirmed_decision_summary
        - source_refs
        - output_refs
        - open_questions
        - supersedes
        - handoff_refs
        - finalization_basis
      forbidden_content:
        - full_baseline_copy
        - pm_product_model
        - acceptance_criteria
        - design_decisions
        - implementation_details
        - downstream_requirements
      checkpoint_steps: [问题澄清, 目标、成功标准与投入边界, 业务语义收口, 范围、本期不做、可行性约束与决策理由, 风险与未知项, Phase 规划, Director Finalization]
      canonical_outputs:
        - docs/{feature}/brief.json
        - docs/{feature}/phase-{N}/phase-prd.json
      consumer: product-director
      control_input: false
      note: Product Manager and Design do not have co-creation ledger artifacts.
  validation:
    command: python3 tools/community/validate_co_creation_ledger.py --artifact <ledger.json> --producer <producer> --require-finalized
    unresolved_supersedes_blocks_finalization: true
    latest_checkpoint_must_match_last_confirmation: true
