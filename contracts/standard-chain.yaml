# contracts/standard-chain.yaml
# 标准流程 skill 输入输出声明（canonical-only）

chain:
  - name: product-director
    position: main
    inputs:
      required: [用户需求描述]
      optional: [constitution.md]
    outputs:
      - artifact: brief.json
        key_fields: [root_problem, user_profile, business_goals, appetite, scope_boundaries, non_goals, feasibility_constraints, risks_and_unknowns, decision_rationale, delivery_plan, director_confirmation]
        consumers: [product-manager]
      - artifact: "phase-{N}/phase-prd.json"
        key_fields: [phase_goal, entry_conditions, exit_conditions, unit_index, director_confirmation]
        consumers: [product-manager]

  - name: product-manager
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json"]
      optional: [constitution.md]
    outputs:
      - artifact: brief.json
        operation: refine
        upstream_producer: product-director
        key_fields: [business_goals, acceptance_criteria, design_decisions, non_functional_requirements, delivery_plan, review_conclusion, issue_ledger, delivery_confirmation]
        consumers: [design, test-design, tech-lead, qa, delivery-owner]
      - artifact: "phase-{N}/phase-prd.json"
        operation: refine
        upstream_producer: product-director
        key_fields: [phase_goal, entry_conditions, exit_conditions, business_flows, user_paths, rule_mappings, unit_index, design_decision_candidates, review_conclusion, issue_ledger]
        consumers: [design, test-design, tech-lead, qa, delivery-owner]
      - artifact: "phase-{N}/units/UNIT-{N}.json"
        key_fields: [unit_id, closure_definition, integration_context, acceptance_criteria, verification_plan, design_decision_candidates, exclusions, priority, priority_basis, dependencies]
        consumers: [design, test-design, tech-lead]

  - name: design
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/units/UNIT-{N}.json"]
      optional: [constitution.md]
    outputs:
      - artifact: "phase-{N}/design.json"
        key_fields: [input_analysis, key_decisions, option_analysis, runtime_facts, interfaces, interface_boundary, quality_attributes, migration_plan, verification_plan, rollback_plan]
        consumers: [test-design, tech-lead, developer]

  - name: test-design
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/units/UNIT-{N}.json", "phase-{N}/design.json"]
    outputs:
      - artifact: "phase-{N}/unit-{N}/test-cases.json"
        key_fields: [ac_coverage_matrix, equivalence_matrix, test_cases, qa_handoff_contract, unit_coverage_view, design_gap_report, special_test_triggers, review_conclusion, issue_ledger]
        consumers: [tech-lead, delivery-owner, developer, qa]

  - name: tech-lead
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/units/UNIT-{N}.json", "phase-{N}/design.json", "phase-{N}/unit-{N}/test-cases.json"]
    outputs:
      - artifact: "phase-{N}/plan.json"
        key_fields: [planning_mode, plan_version, baseline_plan_version_ref, baseline_tasks_version_ref, scope_freeze, task_list, goal_source_refs, constraint_source_refs, obligation_source_refs, execution_basis_refs, design_review, goal_fidelity_review, user_confirmation]
        consumers: [delivery-owner, developer, verify, qa]
      - artifact: "phase-{N}/tasks.json"
        key_fields: [plan_version, tasks]
        consumers: [delivery-owner, developer, verify]

  - name: developer
    position: main
    inputs:
      required: ["phase-{N}/design.json", "phase-{N}/tasks.json"]
      optional: ["phase-{N}/unit-{N}/test-cases.json"]
    outputs:
      - artifact: "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json"
        key_fields: [runtime_status, evidence_refs, reviewable_anchor, tdd_evidence_index]
        terminal: true
      - artifact: code
        terminal: true

  - name: review
    position: main
    inputs:
      required: ["phase-{N}/plan.json", "phase-{N}/tasks.json", "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json"]
    outputs:
      - artifact: "phase-{N}/code-review-result.json"
        key_fields: [gate_result, dimension_verdicts, findings, excluded, review_conclusion]
        terminal: true

  - name: verify
    position: main
    inputs:
      required: ["phase-{N}/plan.json", "phase-{N}/tasks.json", "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json"]
      optional: ["phase-{N}/design.json", "phase-{N}/unit-{N}/test-cases.json"]
    outputs:
      - artifact: "phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json"
        key_fields: [gate_result, baseline_plan_version_ref, baseline_tasks_version_ref, developer_report_ref, phase_verdicts, ac_verification, goal_closure, evidence_refs]
        terminal: true

  - name: qa
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/units/UNIT-{N}.json", "phase-{N}/plan.json", "phase-{N}/design.json", "phase-{N}/unit-{N}/test-cases.json", "phase-{N}/code-review-result.json"]
      optional: ["phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json", "phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json"]
    outputs:
      - artifact: "phase-{N}/qa-result.json"
        key_fields: [baseline_plan_version_ref, baseline_tasks_version_ref, current_stage, gate_result, release_recommendation, residual_risk, uncovered_boundary, conditional_release_basis, not_executed_reason, ruled_out_issues, stage_results, issue_ledger]
        consumers: [delivery-owner]

  - name: consistency-auditor
    position: sidecar
    decision_authority: advisory_only
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/artifact-registry.json"]
      optional: ["phase-{N}/units/UNIT-{N}.json", "phase-{N}/design.json", "phase-{N}/plan.json", "phase-{N}/tasks.json", "phase-{N}/unit-{N}/test-cases.json", "phase-{N}/code-review-result.json", "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json", "phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json", "phase-{N}/qa-result.json", "phase-{N}/delivery-state.json", "phase-{N}/signoff-package.json"]
    outputs:
      - artifact: "phase-{N}/consistency-audit-result.json"
        key_fields: [decision_authority, consumer, blocked_layers, skipped_layers, tool_warning, findings, required_owner_action]
        consumers: [tech-lead, delivery-owner]

  - name: fix
    position: sidecar
    inputs:
      required: ["phase-{N}/plan.json", "phase-{N}/tasks.json"]
      optional: ["phase-{N}/code-review-result.json", "phase-{N}/qa-result.json", "phase-{N}/consistency-audit-result.json", "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json", "phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json"]
    outputs:
      - artifact: "phase-{N}/fix-result.json"
        key_fields: [active_plan_version_ref, active_tasks_version_ref, trigger_refs, attempt, completion_status, issues, red_green_evidence, regression_evidence]
        consumers: [delivery-owner, review, verify, qa]

  - name: delivery-owner
    position: main
    inputs:
      required: [brief.json, "phase-{N}/phase-prd.json", "phase-{N}/artifact-registry.json", "phase-{N}/plan.json", "phase-{N}/tasks.json", "phase-{N}/design.json", "phase-{N}/unit-{N}/test-cases.json", "phase-{N}/code-review-result.json", "phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json", "phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json", "phase-{N}/qa-result.json", "phase-{N}/consistency-audit-result.json"]
      optional: ["phase-{N}/fix-result.json"]
    outputs:
      - artifact: "phase-{N}/delivery-state.json"
        key_fields: [active_plan_version_ref, active_tasks_version_ref, current_stage, status, control_action, summary_text, tasks]
        terminal: true
      - artifact: "phase-{N}/artifact-registry.json"
        operation: append_revision
        upstream_producer: artifact-registry-writer
        key_fields: [scope_ref, registry_revision, active_revision_id, revisions]
        terminal: true
      - artifact: "phase-{N}/signoff-package.json"
        key_fields: [current_stage, release_recommendation, goal_closure, sign_off_status, business_risk_acceptance_status, decision_basis_refs]
        terminal: true
      - artifact: "phase-{N}/user-decision.json"
        operation: import_user_decision
        upstream_producer: user-decision-writer
        key_fields: [current_stage, decision, decision_basis_refs, director_lock_digests]
        terminal: true

artifact_contract:
  phase_dir: "docs/{feature}/phase-{N}"
  unit_definition_dir: "docs/{feature}/phase-{N}/units"
  unit_work_dir: "docs/{feature}/phase-{N}/unit-{N}"
  feature_brief_artifact: "docs/{feature}/brief.json"
  phase_prd_artifact: "docs/{feature}/phase-{N}/phase-prd.json"
  unit_definition_artifact: "docs/{feature}/phase-{N}/units/UNIT-{N}.json"
  design_artifact: "docs/{feature}/phase-{N}/design.json"
  test_cases_artifact: "docs/{feature}/phase-{N}/unit-{N}/test-cases.json"
  plan_artifact: "docs/{feature}/phase-{N}/plan.json"
  tasks_artifact: "docs/{feature}/phase-{N}/tasks.json"
  developer_report_artifact: "docs/{feature}/phase-{N}/unit-{N}/tasks/{task_id}/developer-report.json"
  verify_result_artifact: "docs/{feature}/phase-{N}/unit-{N}/tasks/{task_id}/verify-result.json"
  review_artifact: "docs/{feature}/phase-{N}/code-review-result.json"
  qa_report_artifact: "docs/{feature}/phase-{N}/qa-result.json"
  delivery_state_artifact: "docs/{feature}/phase-{N}/delivery-state.json"
  artifact_registry_artifact: "docs/{feature}/phase-{N}/artifact-registry.json"
  artifact_registry_bootstrap_producer: artifact-registry-writer
  artifact_registry_append_producer: delivery-owner
  consistency_audit_result_artifact: "docs/{feature}/phase-{N}/consistency-audit-result.json"
  fix_result_artifact: "docs/{feature}/phase-{N}/fix-result.json"
  signoff_package_artifact: "docs/{feature}/phase-{N}/signoff-package.json"
  user_decision_artifact: "docs/{feature}/phase-{N}/user-decision.json"
  qa_report_producer: qa
  qa_dispatch_required_inputs:
    - brief.json
    - "phase-{N}/phase-prd.json"
    - "phase-{N}/units/UNIT-{N}.json"
    - "phase-{N}/design.json"
    - "phase-{N}/plan.json"
    - "phase-{N}/unit-{N}/test-cases.json as test_cases_ref"

authority_contract:
  plan_owner: tech-lead
  phase_delivery_owner: delivery-owner
  quality_judgment_owner: qa
  consistency_audit_owner: consistency-auditor
  task_implementation_owner: developer
  sign_off_owner: user
  business_risk_acceptance_owner: user
  consistency_auditor_decision_authority: advisory_only
  delivery_owner_may_decide: [delivery_kickoff, batch_order, task_priority_within_scope_freeze, sidecar_dispatch, replan_request]
  delivery_owner_must_escalate: [scope_change, design_change, business_risk_acceptance, sign_off_rejection]
