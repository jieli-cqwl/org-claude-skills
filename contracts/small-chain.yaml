# contracts/small-chain.yaml

# 当前布局采用“稳定 feature 根 + dated active workset”兼容桥接：
# - handoff entry: docs/{feature}/worklog.md
# - active workset: docs/{feature}/YYYY-MM-DD-{change}/
# - small-chain 主干工件仍位于 active workset 中
# - 本合同只适用于 contracts/active-doc-scope.yaml 中 `mode=small-chain` 且 `management_status in [managed, migrated]` 的 feature

active_scope:
  registry: contracts/active-doc-scope.yaml
  mode: small-chain
  active_status_field: management_status
  bootstrap_compatibility_status_field: status
  statuses: [managed, migrated]
  active_status_values: [managed, migrated]
  entry_ref: worklog.md
  allowed_stages: [entry, plan, env, execute, verify-preflight, verify, integrate, finish, blocked]
  true_progress_artifacts: [design.md, tasks.md, plan.md]
  artifact_globs_expand_within_scope_only: true

chain:
  - name: using-superpowers
    position: meta
    inputs:
      required: [用户请求]
    outputs:
      - artifact: workflow-discipline
        consumers: [brainstorming]

  - name: brainstorming
    position: entry
    inputs:
      required: [用户请求]
      optional: [workflow-discipline]
    outputs:
      - artifact: "docs/*/worklog.md"
        consumers: [writing-plans, using-git-worktrees, subagent-driven-development, verify-change]
      - artifact: "docs/*/YYYY-MM-DD-*/design.md"
        consumers: [writing-plans]
        key_fields:
          always_required:
            - problem_statement
            - goals_success_criteria
            - approach
            - alternatives_considered
            - risks
          conditionally_required:
            - change_scope
            - invariants
            - downstream_impact

  - name: writing-plans
    position: plan
    inputs:
      required:
        - "docs/*/worklog.md"
        - "docs/*/YYYY-MM-DD-*/design.md"
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/tasks.md"
        consumers: [using-git-worktrees, subagent-driven-development]
        key_fields:
          per_task:
            - deliverable
            - acceptance_criteria
            - traces
            - depends
            - complexity
      - artifact: "docs/*/YYYY-MM-DD-*/plan.md"
        consumers: [using-git-worktrees, subagent-driven-development]
        key_fields:
          per_task_section:
            - context
            - files
            - steps

  - name: using-git-worktrees
    position: env
    required_when: isolated_workspace_not_already_available
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/plan.md"
    outputs:
      - artifact: isolated-worktree
        consumers: [subagent-driven-development]

  - name: subagent-driven-development
    position: execute
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - isolated-worktree
    outputs:
      - artifact: tasks-progress
        consumers: [verification-before-completion]

  - name: verification-before-completion
    position: verify-preflight
    inputs:
      required:
        - tasks-progress
        - code
    outputs:
      - artifact: fresh-verification-evidence
        consumers: [verify-change, finishing-a-development-branch]

  - name: verify-change
    position: verify
    inputs:
      required:
        - "docs/*/worklog.md"
        - "docs/*/YYYY-MM-DD-*/design.md"
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - code
        - fresh-verification-evidence
    outputs:
      - artifact: change-verification
        consumers: [finishing-a-development-branch, archive]

  - name: finishing-a-development-branch
    position: integrate
    required_when: branch_integration_or_worktree_cleanup_pending
    inputs:
      required:
        - change-verification
    outputs:
      - artifact: branch-finalization
        consumers: [archive]

  - name: archive
    position: finish
    inputs:
      required:
        - change-verification
      optional:
        - branch-finalization
    preconditions:
      required:
        - change-verification PASS
        - integrated_on_target_branch
      route_notes:
        - branch-finalization is required when branch integration or worktree cleanup was pending
        - branch-finalization may be absent when verify-change already ran on the integrated target branch and no cleanup is pending
    outputs:
      - artifact: archived-change
        terminal: true
