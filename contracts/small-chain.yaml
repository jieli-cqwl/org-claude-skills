# contracts/small-chain.yaml

chain:
  - name: using-superpowers
    position: meta
    inputs:
      required: [用户请求]
    outputs:
      - artifact: workflow-discipline
        consumers: [brainstorming]

  - name: brainstorming
    position: entry
    inputs:
      required: [用户请求]
      optional: [workflow-discipline]
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/design.md"
        consumers: [writing-plans]

  - name: writing-plans
    position: plan
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/design.md"
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/tasks.md"
        consumers: [using-git-worktrees, subagent-driven-development]
      - artifact: "docs/*/YYYY-MM-DD-*/plan.md"
        consumers: [using-git-worktrees, subagent-driven-development]

  - name: using-git-worktrees
    position: env
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/plan.md"
    outputs:
      - artifact: isolated-worktree
        consumers: [subagent-driven-development]

  - name: subagent-driven-development
    position: execute
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - isolated-worktree
    outputs:
      - artifact: tasks-progress
        consumers: [verification-before-completion]

  - name: verification-before-completion
    position: verify-preflight
    inputs:
      required:
        - tasks-progress
        - code
    outputs:
      - artifact: fresh-verification-evidence
        consumers: [verify-change, finishing-a-development-branch]

  - name: verify-change
    position: verify
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/design.md"
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - code
        - fresh-verification-evidence
    outputs:
      - artifact: change-verification
        consumers: [finishing-a-development-branch, archive]

  - name: finishing-a-development-branch
    position: integrate
    inputs:
      required:
        - change-verification
    outputs:
      - artifact: branch-finalization
        consumers: [archive]

  - name: archive
    position: finish
    inputs:
      required:
        - change-verification
        - branch-finalization
    outputs:
      - artifact: archived-change
        terminal: true
