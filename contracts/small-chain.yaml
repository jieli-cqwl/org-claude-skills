# contracts/small-chain.yaml

# 当前布局采用“稳定 feature 根 + dated active workset”兼容桥接：
# - handoff entry: docs/{feature}/worklog.md
# - active workset: docs/{feature}/YYYY-MM-DD-{change}/
# - small-chain 主干工件仍位于 active workset 中
# - scope registry 是 contracts/active-doc-scope.yaml
# - 本合同只适用于 `mode=small-chain` 且 `management_status in [managed, migrated]` 的 feature
# - entry_ref 固定指向 feature 根 worklog.md，最新 handoff_status/state_ref/next_ref 只做接手导航

active_scope:
  registry: contracts/active-doc-scope.yaml
  mode: small-chain
  status_field: management_status
  statuses: [managed, migrated]
  entry_ref: worklog.md
  worklog_fields: [handoff_status, state_ref, next_ref]
  artifact_globs_expand_within_scope_only: true

automation:
  helper: tools/community/small_chain_closeout.py
  integration_policy: pr_auto_merge
  post_verify_route:
    - create_pr
    - enable_auto_merge
    - wait_for_merge
    - archive_after_merge
  archive_requires:
    - verify_change_pass
    - no_critical_findings
    - merged_on_target_branch

chain:
  - name: using-superpowers
    position: meta
    inputs:
      required: [用户请求]
    outputs:
      - artifact: workflow-discipline
        consumers: [brainstorming]

  - name: brainstorming
    position: entry
    inputs:
      required: [用户请求]
      optional: [workflow-discipline]
    outputs:
      - artifact: "docs/*/worklog.md"
        consumers: [writing-plans, small-chain-execution-router, using-git-worktrees, subagent-driven-development, verify-change]
      - artifact: "docs/*/YYYY-MM-DD-*/design.md"
        consumers: [writing-plans]
        key_fields:
          always_required:
            - problem_statement
            - goals_success_criteria
            - approach
            - alternatives_considered
            - risks
          conditionally_required:
            - change_scope
            - invariants
            - downstream_impact
            - contract_grade_preflight

  - name: writing-plans
    position: plan
    inputs:
      required:
        - "docs/*/worklog.md"
        - "docs/*/YYYY-MM-DD-*/design.md"
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/tasks.md"
        consumers: [small-chain-execution-router, using-git-worktrees, subagent-driven-development, parallel-subagent-development]
        key_fields:
          per_task:
            - deliverable
            - acceptance_criteria
            - traces
            - depends
            - complexity
      - artifact: "docs/*/YYYY-MM-DD-*/plan.md"
        consumers: [small-chain-execution-router, using-git-worktrees, subagent-driven-development, parallel-subagent-development]
        key_fields:
          per_task_section:
            - context
            - files
            - steps
      - artifact: "docs/*/YYYY-MM-DD-*/execution-routing-input.json"
        consumers: [small-chain-execution-router]
        key_fields:
          required:
            - schema_version
            - requested_mode
            - tasks
          per_task:
            - task_id
            - depends
            - exclusive_files
            - shared_files
            - proving_commands
            - touches_contract_grade
      - artifact: plan-stage-worklog-handoff
        operation: update
        upstream_producer: "docs/*/worklog.md"
        consumers: [small-chain-execution-router]
        key_fields:
          required:
            - "stage: plan"
            - "state_ref: tasks.md"
            - "next_ref: execution-routing-input.json"

  - name: small-chain-execution-router
    position: route
    inputs:
      required:
        - "docs/*/worklog.md"
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - "docs/*/YYYY-MM-DD-*/execution-routing-input.json"
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/execution-route.json"
        consumers: [using-git-worktrees, subagent-driven-development, parallel-subagent-development, verify-change]
        key_fields:
          required:
            - decision
            - reason
            - tasks_hash
            - plan_hash
            - routing_input_hash
            - worktree_policy
          decision_enum: [serial, parallel, blocked]

  - name: using-git-worktrees
    position: env
    required_when: execution_route_decision_serial_and_isolated_workspace_not_already_available
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/execution-route.json"
        - "docs/*/YYYY-MM-DD-*/plan.md"
    outputs:
      - artifact: isolated-worktree
        consumers: [subagent-driven-development]

  - name: subagent-driven-development
    position: execute
    required_when: execution_route_decision_serial
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - "docs/*/YYYY-MM-DD-*/execution-route.json"
        - isolated-worktree
    outputs:
      - artifact: tasks-progress
        consumers: [verification-before-completion]

  - name: parallel-subagent-development
    position: execute
    required_when: execution_route_decision_parallel
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - "docs/*/YYYY-MM-DD-*/execution-route.json"
    outputs:
      - artifact: parallel-execution-report
        consumers: [verification-before-completion, verify-change]
      - artifact: tasks-progress
        operation: update
        upstream_producer: subagent-driven-development
        consumers: [verification-before-completion]

  - name: verification-before-completion
    position: verify-preflight
    inputs:
      required:
        - tasks-progress
        - code
    outputs:
      - artifact: fresh-verification-evidence
        consumers: [requesting-code-review, verify-change, finishing-a-development-branch]

  - name: requesting-code-review
    position: review
    required_when: contract_grade_or_runtime_gate_change
    inputs:
      required:
        - "docs/*/YYYY-MM-DD-*/design.md"
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - code
        - fresh-verification-evidence
    outputs:
      - artifact: "docs/*/YYYY-MM-DD-*/code-review-result.json"
        consumers: [verify-change]
        key_fields:
          required:
            - review_conclusion
            - gate_result
            - dimension_verdicts
            - findings
            - excluded

  - name: verify-change
    position: verify
    inputs:
      required:
        - "docs/*/worklog.md"
        - "docs/*/YYYY-MM-DD-*/design.md"
        - "docs/*/YYYY-MM-DD-*/tasks.md"
        - "docs/*/YYYY-MM-DD-*/plan.md"
        - code
        - fresh-verification-evidence
      conditionally_required:
        - "docs/*/YYYY-MM-DD-*/code-review-result.json"
    outputs:
      - artifact: change-verification
        consumers: [finishing-a-development-branch, archive]

  - name: finishing-a-development-branch
    position: integrate
    required_when: branch_integration_or_worktree_cleanup_pending
    inputs:
      required:
        - change-verification
    outputs:
      - artifact: branch-finalization
        consumers: [archive]

  - name: archive
    position: finish
    inputs:
      required:
        - change-verification
      optional:
        - branch-finalization
    preconditions:
      required:
        - change-verification PASS
        - integrated_on_target_branch
      route_notes:
        - branch-finalization is required when branch integration or worktree cleanup was pending
        - branch-finalization may be absent when verify-change already ran on the integrated target branch and no cleanup is pending
    outputs:
      - artifact: archived-change
        terminal: true
