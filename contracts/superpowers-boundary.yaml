version: 2
target_state: superpowers_official_full_mirror

runtime_roles:
  community_superpowers: official_third_party_mirror
  standard_chain: first_party_runtime

canonical_targets:
  source_lock: community/SOURCES.yaml
  mirror_root: community/superpowers/skills
  first_party_runtime_root: shared
  first_party_chain_contract: contracts/standard-chain.yaml

source_fidelity:
  upstream_body_policy: exact_locked_ref_original
  local_text_allowed_in: []
  disallowed_mutations:
    - local_overlays
    - local_only_skills
    - generated_codex_adapters
    - runtime_visibility_metadata
    - source_headers
    - compatibility_rewrites

official_skill_count: 14
official_skills:
  - brainstorming
  - dispatching-parallel-agents
  - executing-plans
  - finishing-a-development-branch
  - receiving-code-review
  - requesting-code-review
  - subagent-driven-development
  - systematic-debugging
  - test-driven-development
  - using-git-worktrees
  - using-superpowers
  - verification-before-completion
  - writing-plans
  - writing-skills

install_discovery_contract:
  codex_discovery_root: ~/.codex/skills
  required_file_pattern: ~/.codex/skills/<official-superpowers-skill>/SKILL.md
  registration_source: official_skill_frontmatter
  superpowers_agent_adapters_allowed: false

local_content_policy:
  community_superpowers: third_party_clean_room
  first_party_custom_flow: shared_and_contracts_only
