version: 1
target_state: superpowers_small_chain_concepts_only

runtime_roles:
  community_superpowers: upstream_aligned_runtime
  small_chain: wrapper_and_contract
  openspec: archived  # 仅保留历史语义，不再要求保留运行时文档
  community_openspec: archived  # 概念已退役，不再作为运行时角色

canonical_targets:
  default_chain_contract: contracts/small-chain.yaml
  source_lock: community/SOURCES.yaml
  overlay_contract: contracts/superpowers-boundary.yaml
  runtime_entry_skill: community/superpowers/skills/using-superpowers/SKILL.md

source_fidelity:
  upstream_body_policy: locked_ref_original
  local_text_allowed_in:
    - declared_overlay_files
    - generated_codex_adapters
    - runtime_visibility_metadata
  local_only_files:
    - community/superpowers/codex/skills/brainstorming/agents/openai.yaml
    - community/superpowers/skills/archive/SKILL.md
    - community/superpowers/skills/parallel-subagent-development/SKILL.md
    - community/superpowers/skills/verify-change/SKILL.md
    - community/superpowers/skills/verify-change/scripts/check_task_plan_consistency.py
  runtime_visibility_metadata:
    - community/superpowers/skills/*/SKILL.md frontmatter description
    - community/superpowers/skills/using-superpowers/SKILL.md frontmatter disable-model-invocation
  disallowed_body_mutations:
    - machine_generated_language_rewrite
    - undeclared_body_rewrite
    - compatibility_anchors_for_rewritten_body

upstream_update_policy:
  refresh_entrypoint: community-skill-updater
  source_lock_file: community/SOURCES.yaml
  cadence: periodic_manual_or_scheduled_check
  order:
    - update_upstream_ref_and_vendor_mirror
    - preserve_declared_overlay_and_local_only_files
    - reconcile_overlay_against_upstream_workflow_changes
    - run_contract_and_runtime_validation
  rules:
    - upstream skill bodies stay aligned to the locked ref unless listed in overlay_files
    - local-only closeout skills stay outside upstream provenance and must keep Source local
    - runtime metadata may be regenerated, but must not rewrite upstream body content
    - if upstream changes workflow semantics, update this boundary contract before changing runtime chain docs

declared_forks:
  - id: superpowers_active_paths_use_docs_workspace
    scope: community/superpowers
    reason: active draft and plan paths use docs/*/YYYY-MM-DD-* artifact locations
    owner_source: contracts/superpowers-boundary.yaml
  - id: writing_plans_local_task_contract_hint
    scope: community/superpowers/skills/writing-plans/SKILL.md
    reason: local task-plan consistency points to contract and validator instead of redefining rules inline
    owner_source: contracts/superpowers-boundary.yaml
  - id: brainstorming_design_completeness_gate
    scope: community/superpowers/skills/brainstorming
    reason: add design completeness checklist (D1-D8) and expanded template per small-chain.yaml key_fields
    owner_source: contracts/superpowers-boundary.yaml
  - id: writing_plans_task_traceability
    scope: community/superpowers/skills/writing-plans/SKILL.md
    reason: add Traces/Depends/Complexity to tasks.md template, Context to plan.md, and 3 HARD-GATE checks
    owner_source: contracts/superpowers-boundary.yaml
  - id: writing_plans_execution_router_handoff
    scope: community/superpowers/skills/writing-plans/SKILL.md
    reason: add execution-routing-input.json and plan-stage worklog handoff for local small-chain execution routing
    owner_source: contracts/superpowers-boundary.yaml
  - id: parallel_subagent_local_runtime_wrapper
    scope: community/superpowers/skills/parallel-subagent-development/SKILL.md
    reason: local small-chain wrapper for router-approved parallel execution with worktree and evidence contracts
    owner_source: contracts/superpowers-boundary.yaml
  - id: contract_grade_review_gate
    scope: community/superpowers/skills/requesting-code-review/SKILL.md
    reason: require active workset code-review-result.json before verify-change for contract-grade/runtime-gate changes
    owner_source: contracts/superpowers-boundary.yaml

allowed_legacy_paths: []

closeout_policy:
  required_sequence:
    - verification-before-completion
    - requesting-code-review
    - verify-change
    - finishing-a-development-branch
    - archive
  required_after_implementation:
    - verification-before-completion
    - verify-change
  conditional_review_required_when:
    - contract_grade_preflight_present
    - runtime_gate_or_status_decision_script_touched
  conditional_routes:
    - when: branch_integration_or_worktree_cleanup_pending
      sequence:
        - finishing-a-development-branch
        - archive
    - when: already_integrated_on_target_branch_and_no_cleanup_pending
      sequence:
        - archive
  verify_change_required_before:
    - finishing-a-development-branch
    - archive
  code_review_required_before:
    - verify-change
  finishing_required_when: branch_integration_or_worktree_cleanup_pending
  archive_requires: integrated_on_target_branch
  automation_helper: tools/community/small_chain_closeout.py
  integration_policy: pr_auto_merge
  auto_merge_authority: ci_and_branch_protection

overlay_files:
  - community/superpowers/skills/brainstorming/SKILL.md
  - community/superpowers/skills/brainstorming/spec-document-reviewer-prompt.md
  - community/superpowers/skills/brainstorming/references/design-template.md
  - community/superpowers/skills/brainstorming/references/design-completeness-checklist.md
  - community/superpowers/skills/writing-plans/SKILL.md
  - community/superpowers/skills/parallel-subagent-development/SKILL.md
  - community/superpowers/skills/subagent-driven-development/SKILL.md
  - community/superpowers/skills/subagent-driven-development/implementer-prompt.md
  - community/superpowers/skills/subagent-driven-development/spec-reviewer-prompt.md
  - community/superpowers/skills/subagent-driven-development/code-quality-reviewer-prompt.md
  - community/superpowers/skills/requesting-code-review/SKILL.md
  - community/superpowers/skills/using-git-worktrees/SKILL.md
  - community/superpowers/skills/using-superpowers/SKILL.md
  - community/superpowers/skills/using-superpowers/references/codex-tools.md
  - community/superpowers/skills/using-superpowers/references/gemini-tools.md
  - community/superpowers/skills/finishing-a-development-branch/SKILL.md
  - community/superpowers/skills/verify-change/SKILL.md
  - community/superpowers/skills/verify-change/scripts/check_task_plan_consistency.py
  - community/superpowers/skills/archive/SKILL.md
  - community/superpowers/codex/skills/brainstorming/agents/openai.yaml
