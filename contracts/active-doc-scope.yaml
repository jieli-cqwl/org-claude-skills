# 活跃文档受管作用域真源
#
# 说明：
# - 本文件记录 rollout 跟踪条目；只有 `status in [managed, migrated]` 的条目才视为 managed active scope。
# - 目录名合法、存在 worklog.md、或位于 docs/ 下，都不自动等于已纳管。
# - 该文件只允许由 bootstrap / adopt / archive 流程写入；手工修改属于 break-glass 例外。
# - 所有 `*_relpath` 都相对 `feature_path`。

version: 1

record_contract:
  required: [feature_path, mode, status, rollout_phase, layout, owner]
  enums:
    mode: [small-chain, full-chain]
    status: [legacy, managed, migrated]
    layout: [dated-workset, phase-tree]
  conditional_required:
    dated-workset: [primary_workset_relpath]

