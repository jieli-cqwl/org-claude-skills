# Product artifact contract.
#
# This file is the machine-readable source for product-director and
# product-manager result fields. Templates may show the same headings, but
# gates and tests should consume this contract when they need executable rigor.
product_artifacts:
  brief_result:
    sections:
      - 业务背景与根问题
      - 用户画像
      - 目标与成功标准
      - Appetite
      - 范围 / Non-goals
      - 前置约束
      - 风险与未知项
      - 决策理由
      - 交付计划
  phase_result:
    sections:
      - 阶段目标
      - 入口与出口条件
  product_manager_phase_contract:
    sections:
      - Evidence Sources
      - AS-IS Flows
      - TO-BE Flows
      - Business Process Graphs
      - Feature Inventory
      - Module Capability Matrix
      - Entry Scene Inventory
      - Business Objects
      - State Transitions
      - Role Permission Matrix
      - Risk Ledger
      - Coverage Matrix
      - Technical Evidence Requirements
      - Release Readiness
      - Business Flows
      - User Paths
      - Rule Mappings
      - Unit Index
      - Unit Priority Order
      - Design Decision Candidates
  product_manager_unit_contract:
    sections:
      - Closure Definition
      - Trigger
      - Core Behavior
      - Observable Result
      - Feature Refs
      - Flow Refs
      - Risk Refs
      - Rule Refs
      - Integration Context
      - Acceptance Criteria
      - Verification Plan
      - Design Decision Candidates
      - Exclusions
      - Priority
      - Dependencies
  product_manager_review_contract:
    sections:
      - 最终结论
      - 未决阻断
    required_views:
      - 产品
      - 架构
      - 测试
