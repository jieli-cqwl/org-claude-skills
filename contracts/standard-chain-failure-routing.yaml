failure_routing:
  schema_version: "1.0.0"
  result_schema: contracts/canonical/schemas/runtime/failure-routing-result.schema.json
  entries:
    - failure_code: NONE
      status: PASS
      default_owner: delivery-owner
      default_next_action: continue
      safe_to_continue: true
      human_decision_required: false
      continuation_condition: none
      message_template: Standard-chain gate passed.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: CONDITIONAL_CONTINUE
      status: WARN
      default_owner: delivery-owner
      default_next_action: continue_after_condition
      safe_to_continue: true
      human_decision_required: false
      continuation_condition: Record the warning condition and evidence before handoff.
      message_template: Standard-chain gate may continue after the continuation condition is met.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: MISSING_ARTIFACT
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: produce_or_restore_artifact
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Required canonical artifact is missing.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: MALFORMED_ARTIFACT
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: repair_artifact_shape
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Required canonical artifact is malformed.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: STALE_EVIDENCE
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: rerun_fresh_proof
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Evidence is stale and must be regenerated for the current run.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: AMBIGUOUS_TARGET
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: clarify_target
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Checker target is ambiguous.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: MISSING_HUMAN_CONFIRMATION
      status: BLOCKED
      default_owner: user
      default_next_action: request_human_confirmation
      safe_to_continue: false
      human_decision_required: true
      continuation_condition: none
      message_template: A required human decision or confirmation is missing.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: UNREGISTERED_FAILURE_CODE
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: register_failure_code_or_fix_checker
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Checker emitted an unregistered failure code and must fail closed.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: ADAPTER_TIMEOUT
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: inspect_adapter_timeout
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Hook adapter timed out before producing a routing result.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: ADAPTER_OUTPUT_OVERFLOW
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: inspect_adapter_output_limit
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Hook adapter output exceeded the allowed routing result size.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: UNAUTHORIZED_SCOPE
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: narrow_or_authorize_scope
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Requested write scope is not authorized for this role or task.
      introduced_in: "1.0.0"
      retired_in: null
    - failure_code: HANDOFF_NOT_READY
      status: BLOCKED
      default_owner: delivery-owner
      default_next_action: complete_handoff_requirements
      safe_to_continue: false
      human_decision_required: false
      continuation_condition: none
      message_template: Role output is not ready for downstream handoff.
      introduced_in: "1.0.0"
      retired_in: null
