# contracts/skill-chain.yaml
# 全链路 skill 输入-输出声明（轻量化，单一文件）

chain:
  - name: product
    position: main
    inputs:
      required: [用户需求描述]
      optional: [constitution.md]
    outputs:
      - artifact: brief.md
        key_fields: [business_goals, acceptance_criteria, design_decisions, non_functional_req, delivery_plan, review_conclusion, issue_ledger]
      - artifact: "phase-{N}/prd.md"
        key_fields: [phase_goal, entry_exit_conditions, unit_index]
      - artifact: "phase-{N}/units/UNIT-*.md"
        key_fields: [closure_definition, acceptance_criteria, exclusions]

  - name: design
    position: main
    inputs:
      required: [brief.md, "phase-{N}/prd.md", "phase-{N}/units/UNIT-*.md"]
      optional: [constitution.md]
    outputs:
      - artifact: design.md
        key_fields: [input_analysis, upstream_review, key_decisions, interface_boundary, impact_access_list, quality_attributes, plan_constraints, review_conclusion, issue_ledger]
        consumers: [test-design, tech-lead, developer]
      - artifact: "design/MOD-*.md"
        consumers: [test-design, tech-lead, developer]
      - artifact: "design/adr/ADR-*.md"
        terminal: true

  - name: test-design
    position: main
    inputs:
      required: [brief.md, "phase-{N}/prd.md", "phase-{N}/units/UNIT-*.md", design.md]
      optional: ["design/MOD-*.md"]
    outputs:
      - artifact: "phase-{N}/unit-{N}/test-cases.md"
        key_fields: [ac_coverage_matrix, equivalence_matrix, test_cases, qa_handoff_contract, review_conclusion, issue_ledger]
        consumers: [tech-lead, delivery-owner, developer, qa]

  - name: tech-lead
    position: main
    inputs:
      required: [brief.md, "phase-{N}/prd.md", "phase-{N}/units/UNIT-*.md", design.md, "phase-{N}/unit-{N}/test-cases.md"]
      optional: ["design/MOD-*.md"]
    outputs:
      - artifact: plan.md
        key_fields: [planning_mode, plan_version, design_review, coverage_matrix, scope_freeze, task_list, parallel_strategy, replan_rules, plan_revisions, phase3_grade, pre_validation, kickoff_requirements, milestones, risks, goal_fidelity_review]
        consumers: [delivery-owner]

  - name: delivery-owner
    position: main
    inputs:
      required: [brief.md, "phase-{N}/prd.md", plan.md, design.md, "phase-{N}/unit-{N}/test-cases.md", "phase-{N}/qa-report.md"]
    outputs:
      - artifact: "phase-{N}/unit-{N}/dev-report.md"
        key_fields: [task_status, deviation_triggers, control_actions, evidence_refs]
        terminal: true
      - artifact: "phase-{N}/code-review-report.md"
        terminal: true
      - artifact: "phase-{N}/acceptance-summary.md"
        key_fields: [kickoff_status, goal_closure, release_alignment, sign_off_status, business_risk_acceptance_status, risk_acceptance_basis]
        terminal: true

  - name: developer
    position: main
    inputs:
      required: [design.md, "Task 全文(from plan.md)"]
      optional: [test-cases.md, "design/MOD-*.md"]
    outputs:
      - artifact: "developer-report-Task-N.md"
        terminal: true
      - artifact: code
        terminal: true

artifact_contract:
  phase_dir: "docs/{feature}/phase-{N}"
  unit_definition_dir: "docs/{feature}/phase-{N}/units"
  unit_work_dir: "docs/{feature}/phase-{N}/unit-{N}"
  unit_definition_artifact: "phase-{N}/units/UNIT-*.md"
  test_cases_artifact: "phase-{N}/unit-{N}/test-cases.md"
  qa_report_artifact: "phase-{N}/qa-report.md"
  qa_report_producer: qa
  qa_dispatch_required_inputs:
    - brief.md
    - "phase-{N}/prd.md"
    - "phase-{N}/units/UNIT-*.md"
    - "phase-{N}/design.md"
    - "phase-{N}/plan.md"
    - "phase-{N}/unit-{N}/test-cases.md as test_cases_ref"

authority_contract:
  plan_owner: tech-lead
  phase_delivery_owner: delivery-owner
  quality_judgment_owner: qa
  task_implementation_owner: developer
  sign_off_owner: user
  business_risk_acceptance_owner: user
  delivery_owner_may_decide: [delivery_kickoff, batch_order, task_priority_within_scope_freeze, gate_escalation, replan_request]
  delivery_owner_must_escalate: [scope_change, design_change, business_risk_acceptance, sign_off_rejection]
