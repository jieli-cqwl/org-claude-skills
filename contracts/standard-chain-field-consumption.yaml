        required_when: delivery-state is consumed as stage truth
        failure_effect: stage drift can go undetected
      status:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: compare delivery status with signoff and worklog handoff state
            consume_mode: gate
        required_when: delivery-state is audited
        failure_effect: delivery status can contradict downstream handoff
      control_action:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit whether next control action matches current state
            consume_mode: gate
        required_when: delivery-state records the next control action
        failure_effect: delivery can request an action inconsistent with state
      summary_text:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: compare human summary against canonical status fields
            consume_mode: reference
        required_when: delivery-state includes a summary
        failure_effect: summary can mislead handoff without contradicting machine fields
      tasks:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit task status against canonical task artifacts
            consume_mode: gate
        required_when: delivery-state lists task states
        failure_effect: task progress can drift from canonical task outputs
      kickoff:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit kickoff state against phase readiness
            consume_mode: reference
        required_when: delivery-state records kickoff information
        failure_effect: delivery readiness can be asserted without kickoff basis
      progress_signal:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit whether follow-up loops made real progress or must pause
            consume_mode: gate
        required_when: delivery-state records a follow-up loop result
        failure_effect: no-progress loops can be hidden behind ambiguous progress labels
      consecutive_no_progress_count:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: enforce the two-round no-progress pause rule
            consume_mode: gate
        required_when: delivery-state records follow-up loop progress
        failure_effect: repeated no-progress rounds can continue without user decision
      owner_action_consumption:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: verify advisory owner actions were routed and recorded with evidence
            consume_mode: gate
        required_when: consistency audit reports blocked_layers, CRITICAL findings, or required_owner_action
        failure_effect: advisory owner actions can be summarized as closed without owner evidence
      blocker_id:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: identify the active recovery blocker
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: blocked state cannot be recovered deterministically
      blocker_owner:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: route blocker resolution to the accountable owner
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: blocker resolution has no accountable owner
      blocker_basis_refs:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: verify why delivery was blocked
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: recovery can proceed without evidence for the block
      resume_stage:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: determine which stage resumes after blocker resolution
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: recovery can resume at an arbitrary or stale stage
      next_action:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: verify the next recovery action is explicit
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: recovery depends on implicit operator memory
      resume_condition:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: verify the condition required before resuming delivery
            consume_mode: gate
        required_when: delivery-state is BLOCKED or requests a user decision
        failure_effect: delivery can resume before blocker evidence is actually resolved

  - path: docs/{feature}/phase-{N}/artifact-registry.json
    producer: delivery-owner
    fields:
      scope_ref:
        producer: artifact-registry-writer
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit registry scope against phase scope
            consume_mode: gate
        required_when: registry is consumed by downstream roles
        failure_effect: artifacts can be resolved under the wrong scope
      registry_revision:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit registry revision identity
            consume_mode: reference
        required_when: registry is appended
        failure_effect: registry updates cannot be ordered or diagnosed
      active_revision_id:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: resolve active artifacts without using history fallback
            consume_mode: gate
        required_when: canonical refs are resolved
        failure_effect: stale history artifacts can be consumed as current truth
      runtime_artifact_policy.required_runtime_artifacts:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: delivery-owner
            consumed_for: require the runtime evidence types that must have active FINALIZED registry entries before closeout
            consume_mode: gate
          - consumer: consistency-auditor
            consumed_for: audit runtime evidence coverage against the registry policy
            consume_mode: gate
        required_when: artifact-registry is consumed for runtime evidence or signoff readiness
        failure_effect: signoff can omit developer, verify, review, QA, or consistency evidence from active registry coverage
      revisions:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: consistency-auditor
            consumed_for: audit append-only registry history and active revision contents
            consume_mode: gate
        required_when: registry is audited
        failure_effect: active artifacts cannot be reconstructed or checked for drift

  - path: docs/{feature}/phase-{N}/signoff-package.json
    producer: delivery-owner
    fields:
      baseline_tasks_version_ref:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show the frozen task baseline behind the signoff decision
            consume_mode: reference
        required_when: signoff package is presented for user decision
        failure_effect: user cannot tell which task baseline is being signed off
      active_tasks_version_ref:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show the active task version behind the signoff decision
            consume_mode: gate
        required_when: signoff package is presented for user decision
        failure_effect: user can approve a stale task state
      current_stage:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show whether the phase is waiting for user decision
            consume_mode: gate
        required_when: signoff package is presented for user decision
        failure_effect: user decision can be requested at the wrong stage
      release_recommendation:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: present delivery-owner release recommendation
            consume_mode: handoff
        required_when: user is asked to sign off, reject, or accept risk
        failure_effect: user decision lacks the delivery recommendation
      goal_closure:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: present closure against phase goals
            consume_mode: gate
        required_when: signoff package claims goal closure
        failure_effect: user cannot judge whether goals were met
      waiver_entries:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: present waivers or confirm none exist
            consume_mode: handoff
        required_when: signoff package includes waiver state
        failure_effect: user may approve without seeing waived obligations
      sign_off_status:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show whether signoff is still pending or already recorded
            consume_mode: gate
        required_when: signoff package is consumed
        failure_effect: repeated or premature signoff can occur
      business_risk_acceptance_status:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show whether business risk acceptance is required or pending
            consume_mode: gate
        required_when: signoff package carries business risk state
        failure_effect: business risk can be accepted implicitly
      last_observed_at:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show freshness of the signoff snapshot
            consume_mode: reference
        required_when: signoff package is generated
        failure_effect: stale observations can be presented as current
      runtime_snapshot:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: summarize runtime evidence for decision
            consume_mode: handoff
        required_when: user decision needs delivery evidence
        failure_effect: user cannot inspect runtime basis
      active_blocker:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: show active blocker or confirm none exists
            consume_mode: gate
        required_when: signoff package reports blocker state
        failure_effect: blocked delivery can be presented as ready
      blocker_owner:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: identify who owns an active blocker
            consume_mode: reference
        required_when: active_blocker is populated
        failure_effect: blocker resolution has no accountable owner
      decision_basis_refs:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: link the artifacts supporting the requested decision
            consume_mode: handoff
        required_when: signoff package is presented for user decision
        failure_effect: user cannot trace decision basis to canonical artifacts
      runtime_evidence_matrix:
        producer: delivery-owner
        authority: delivery-owner
        consumers:
          - consumer: user
            consumed_for: prove signoff covers current developer, verifier, code-review, QA obligation, and consistency-audit runtime evidence
            consume_mode: gate
          - consumer: user-decision-writer
            consumed_for: bind user signoff or risk acceptance to typed runtime artifacts rather than logical summaries
            consume_mode: gate
        required_when: signoff package is presented for user decision
        failure_effect: logical summaries or QA-only refs can replace the full runtime proof chain
