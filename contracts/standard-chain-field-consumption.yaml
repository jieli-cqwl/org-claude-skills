          - consumer: delivery-owner
            consumed_for: route the fix back to the failing review, verify, QA, or audit evidence
            consume_mode: gate
          - consumer: review
            consumed_for: focus fresh code review on the failure that caused the fix
            consume_mode: reference
          - consumer: qa
            consumed_for: rerun the affected user path or obligation after the fix
