# contracts/community-first-chain.yaml

chain:
  - name: using-superpowers
    position: meta
    inputs:
      required: [用户请求]
    outputs:
      - artifact: workflow-discipline
        consumers: [brainstorming]

  - name: brainstorming
    position: entry
    inputs:
      required: [用户请求]
      optional: [workflow-discipline]
    outputs:
      - artifact: "openspec/designs/YYYY-MM-DD-*-draft.md"
        consumers: [writing-plans]

  - name: writing-plans
    position: plan
    inputs:
      required:
        - "openspec/designs/YYYY-MM-DD-*-draft.md"
    outputs:
      - artifact: "openspec/plans/YYYY-MM-DD-*.md"
        consumers: [using-git-worktrees, subagent-driven-development, executing-plans]

  - name: using-git-worktrees
    position: env
    inputs:
      required: ["openspec/plans/YYYY-MM-DD-*.md"]
    outputs:
      - artifact: isolated-worktree
        consumers: [subagent-driven-development, executing-plans]

  - name: subagent-driven-development
    position: execute
    inputs:
      required:
        - "openspec/plans/YYYY-MM-DD-*.md"
        - isolated-worktree

  - name: executing-plans
    position: execute
    inputs:
      required:
        - "openspec/plans/YYYY-MM-DD-*.md"
        - isolated-worktree

  - name: requesting-code-review
    position: review
    inputs:
      required: [code]
    outputs:
      - artifact: review-feedback
        consumers: [verification-before-completion, finishing-a-development-branch]

  - name: verification-before-completion
    position: verify
    inputs:
      required: [code]
      optional: [review-feedback]
    outputs:
      - artifact: verification-evidence
        consumers: [finishing-a-development-branch]

  - name: finishing-a-development-branch
    position: finish
    inputs:
      required: [verification-evidence]
      optional: [review-feedback]
    outputs:
      - artifact: branch-finish-decision
        terminal: true
