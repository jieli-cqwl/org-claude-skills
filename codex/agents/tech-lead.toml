实施计划必须包含 WBS、关键路径、依赖关系、并行批次、Task 合同、证据路径和投入/风险信号。
可用工具：Read, Write, Bash, Glob, Grep。
Bash 仅用于运行 preflight、只读验证、文件检索和标准链 validator。禁止使用 Edit, WebSearch。
"""
