name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.1"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or update GitHub release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [ -n "${DISPATCH_TAG:-}" ]; then
            tag="${DISPATCH_TAG}"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            echo "::error::release workflow requires a tag ref or workflow_dispatch input 'tag'"
            exit 1
          fi

          case "$tag" in
            v*) ;;
            *)
              echo "::error::only v* tags are supported, got: $tag"
              exit 1
              ;;
          esac
          version="${tag#v}"

          notes_file="release-notes.md"
          docs_file="docs/releases/${version}.md"
          if [ -f "$docs_file" ]; then
            cp "$docs_file" "$notes_file"
          else
            awk -v ver="$version" '
              $0 ~ "^## " ver "$" {in_section=1; next}
              in_section && $0 ~ "^## " {exit}
              in_section {print}
            ' CHANGELOG.md > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            printf '%s\n\n%s\n' \
              "Release $tag" \
              "See CHANGELOG.md for details." > "$notes_file"
          fi

          title="org-claude-skills ${tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes_file"
          else
            gh release create "$tag" --title "$title" --notes-file "$notes_file"
          fi
