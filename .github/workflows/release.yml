name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "::error::release workflow requires a tag ref"
            echo "::error::Use workflow_dispatch with --ref <tag> or push a v* tag"
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *)
              echo "::error::only v* tags are supported, got: $tag"
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          notes_file="release-notes.md"
          docs_file="docs/releases/${VERSION}.md"

          if [ -f "$docs_file" ]; then
            cp "$docs_file" "$notes_file"
          else
            awk -v ver="$VERSION" '
              $0 ~ "^## " ver "$" {in_section=1; next}
              in_section && $0 ~ "^## " {exit}
              in_section {print}
            ' CHANGELOG.md > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            cat > "$notes_file" <<EOF
Release $TAG

See CHANGELOG.md for details.
EOF
          fi

          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          title="org-claude-skills ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$title" --notes-file "$NOTES_FILE"
          fi
